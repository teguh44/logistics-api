name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logistics_test
          POSTGRES_USER: logistics_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistics_user -d logistics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/logistics_test
          TEST_DB_USERNAME: logistics_user
          TEST_DB_PASSWORD: test_password
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw --batch-mode clean verify